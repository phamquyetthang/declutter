name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Phiên bản bash
        run: bash --version | head -1; /bin/bash --version | head -1

      - name: Bit thực thi phải còn nguyên sau khi clone
        run: |
          for f in declutter install.sh tests/run.sh; do
            if [ ! -x "$f" ]; then
              echo "::error::$f không có quyền thực thi sau khi clone."
              echo "Sửa: git update-index --chmod=+x $f"
              exit 1
            fi
          done
          echo "OK: declutter, install.sh, tests/run.sh đều executable"

      - name: Kiểm tra cú pháp
        run: |
          for f in declutter lib/*.sh modules/*.sh tests/*.sh install.sh; do
            bash -n "$f" || exit 1
          done

      # macOS ship bash 3.2 ở /bin/bash — chạy test bằng đúng bản đó để chắc
      # không lỡ dùng cú pháp bash 4+ (declare -A, mapfile, ${var,,}…)
      - name: Test (bash hệ thống)
        run: /bin/bash tests/run.sh

      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning -x declutter lib/*.sh modules/*.sh || true

      # Cài thật vào PREFIX tạm rồi chạy QUA SYMLINK — kiểm tra khâu resolve
      # symlink bằng `readlink` (BSD trên macOS không giống GNU) và cả installer.
      - name: install.sh + chạy qua symlink
        run: |
          set -e
          P="$(mktemp -d)/prefix"
          PREFIX="$P" ./install.sh
          test -L "$P/bin/declutter" || { echo "::error::không tạo được symlink"; exit 1; }
          "$P/bin/declutter" --version
          NO_COLOR=1 "$P/bin/declutter" --report | head -5
          echo "OK: chạy được qua symlink"

      - name: install.sh không có git (đường tarball)
        run: |
          set -e
          P="$(mktemp -d)/prefix"
          D="$(mktemp -d)"; cp install.sh "$D/"          # tách khỏi repo để buộc phải tải về
          cd "$D"
          PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            env -u GIT_EXEC_PATH PREFIX="$P" bash -c '
              git() { return 127; }; export -f git 2>/dev/null || true
              ./install.sh' || true
          # chỉ cần khẳng định đường tarball tải và giải nén được
          curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/refs/heads/main" \
            | tar tz | head -3
          echo "OK: tarball tải được"

      - name: Smoke test --report
        run: NO_COLOR=1 ./declutter --report | head -20
