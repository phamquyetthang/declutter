name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Phiên bản bash
        run: bash --version | head -1; /bin/bash --version | head -1

      - name: Kiểm tra cú pháp
        run: |
          for f in declutter lib/*.sh modules/*.sh tests/*.sh install.sh; do
            bash -n "$f" || exit 1
          done

      # macOS ship bash 3.2 ở /bin/bash — chạy test bằng đúng bản đó để chắc
      # không lỡ dùng cú pháp bash 4+ (declare -A, mapfile, ${var,,}…)
      - name: Debug — danh sách có được dựng không
        run: |
          SB=$(mktemp -d)
          export HOME="$SB/home" DECLUTTER_TMP_ROOT="$SB/tmp" \
                 DECLUTTER_LOG="$SB/log" DECLUTTER_SKIP_CMD=1 NO_COLOR=1
          mkdir -p "$HOME/.claude/shell-snapshots" "$HOME/.config/Code/Cache" "$SB/tmp"
          head -c 200000 /dev/urandom > "$HOME/.claude/shell-snapshots/blob.bin"
          head -c 200000 /dev/urandom > "$HOME/.config/Code/Cache/blob.bin"
          echo "--- declare -F register_* ---"
          /bin/bash -c '. lib/core.sh; . lib/registry.sh;
            DECLUTTER_ROOT=$PWD; for m in modules/*.sh; do . "$m"; done;
            declare -F | awk "{print \$3}" | grep "^register_"'
          echo "--- add() có thêm mục không ---"
          /bin/bash -c '. lib/core.sh; . lib/registry.sh; . lib/ui.sh;
            DECLUTTER_ROOT=$PWD; register_all; echo "items=${#I_LEVEL[@]}";
            build_order; echo "order=${#ORDER[@]}"'
          echo "--- sort -k1,1n -k2,2rn ---"
          printf '2\t000000000010\t1\t10\n1\t000000000020\t0\t20\n' | sort -k1,1n -k2,2rn || echo "SORT LỖI"
          echo "--- mktemp không tham số ---"
          mktemp && echo "mktemp ok" || echo "mktemp CẦN template"
          echo "--- report ---"
          /bin/bash ./declutter --report || true

      - name: Test (bash hệ thống)
        run: /bin/bash tests/run.sh

      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning -x declutter lib/*.sh modules/*.sh || true

      - name: Smoke test --report
        run: NO_COLOR=1 ./declutter --report | head -20
